<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('roadly-theme') || 'system';
          const systemPrefersDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = preference === 'dark' || (preference === 'system' && systemPrefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <title>Roadly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
